name: Build and Publish Docker Image to GHCR

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms (comma separated)"
        required: false
        default: "linux/amd64,linux/arm64"
        type: choice
        options:
          - "linux/amd64,linux/arm64"
          - "linux/arm64"
          - "linux/amd64"
      target:
        description: "Dockerfile build target"
        required: false
        default: "runner-base"
        type: choice
        options:
          - "runner-base"
          - "runner-web"
          - "runner-cli"
      tag_latest:
        description: "Tag as latest"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Expand swap space for large builds
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract package version
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=${{ github.event_name == 'workflow_dispatch' && inputs.tag_latest || github.ref == 'refs/heads/main' }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=${{ steps.pkg_version.outputs.version }},enable=${{ steps.pkg_version.outputs.version != '' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'runner-base' }}
          platforms: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-build
          cache-to: type=gha,mode=max,scope=docker-build
          build-args: |
            OMNIROUTE_BUILD_MEMORY_MB=4096
