name: Build and Publish Docker Image to GHCR

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms"
        required: false
        default: "linux/amd64,linux/arm64"
        type: choice
        options:
          - "linux/amd64,linux/arm64"
          - "linux/arm64"
          - "linux/amd64"
      target:
        description: "Dockerfile build target"
        required: false
        default: "runner-base"
        type: choice
        options:
          - "runner-base"
          - "runner-web"
          - "runner-cli"
      custom_tag:
        description: "Custom extra tag (optional, e.g. test-1, custom-build)"
        required: false
        type: string
      tag_latest:
        description: "Tag as latest"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & Push (${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'amd64 + arm64' }})
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Expand swap space for large builds
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract build metadata (version, sha, date)
        id: vars
        run: |
          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "latest")
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +'%Y%m%d')
          BUILD_TIME=$(date -u +'%Y%m%d-%H%M%S')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (multi-tag strategy)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=${{ github.event_name == 'workflow_dispatch' && inputs.tag_latest || (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
          tags: |
            # 1. 基础版本 (如 3.8.50)
            type=raw,value=${{ steps.vars.outputs.version }}
            # 2. 精确版本 + 日期 + Commit SHA (如 3.8.50-20260816-8209b33，长期同一版本也不冲突)
            type=raw,value=${{ steps.vars.outputs.version }}-${{ steps.vars.outputs.build_date }}-${{ steps.vars.outputs.short_sha }}
            # 3. 版本 + Commit SHA (如 3.8.50-8209b33)
            type=raw,value=${{ steps.vars.outputs.version }}-${{ steps.vars.outputs.short_sha }}
            # 4. 纯 Commit SHA (如 sha-8209b33)
            type=sha,prefix=sha-
            # 5. 分支名 (如 release-v3.8.50)
            type=ref,event=branch
            # 6. Git Tag (如 v3.8.50)
            type=ref,event=tag
            # 7. 手动指定的自定义 Tag (如果输入了的话)
            type=raw,value=${{ inputs.custom_tag }},enable=${{ inputs.custom_tag != '' }}

      - name: Set up QEMU (arm64 & amd64 only)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'runner-base' }}
          platforms: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-build
          cache-to: type=gha,mode=max,scope=docker-build
          build-args: |
            OMNIROUTE_BUILD_MEMORY_MB=4096
