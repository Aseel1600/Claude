name: Governor PR7 Runtime Closure

on:
  pull_request:
    branches:
      - release/v3.8.50
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'fix/governor-v1-runtime-closure-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/governor-v1-runtime-closure-20260810
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply precise runtime closure patch
        shell: python
        run: |
          from pathlib import Path

          combo = Path('open-sse/services/combo.ts')
          text = combo.read_text(encoding='utf-8')

          old = '''  apiKeyAllowedConnections = null,\n  nesting = null,\n  hiddenModelsByProvider = getHiddenModelsByProvider(),\n}: HandleComboChatOptions): Promise<Response> {\n  const comboCtx = createComboContext({ body, combo, settings, relayOptions, log });'''
          new = '''  apiKeyAllowedConnections = null,\n  nesting = null,\n  hiddenModelsByProvider = getHiddenModelsByProvider(),\n  correlationId = null,\n}: HandleComboChatOptions): Promise<Response> {\n  if (correlationId) {\n    relayOptions = { ...(relayOptions ?? {}), governorCorrelationId: correlationId };\n  }\n  const comboCtx = createComboContext({ body, combo, settings, relayOptions, log });'''
          if old not in text:
              raise SystemExit('combo correlation patch anchor not found')
          text = text.replace(old, new, 1)

          old = '''          const result = await handleSingleModelWithTimeout(attemptBody, modelStr, {\n            ...targetForAttempt,\n            effectiveComboStrategy: strategy,\n            failoverBeforeRetry: config.failoverBeforeRetry,\n          });\n\n          // Success — validate response quality before returning'''
          new = '''          const result = await handleSingleModelWithTimeout(attemptBody, modelStr, {\n            ...targetForAttempt,\n            effectiveComboStrategy: strategy,\n            failoverBeforeRetry: config.failoverBeforeRetry,\n          });\n\n          if (\n            target.governorSelected === true &&\n            !result.ok &&\n            result.status >= 500 &&\n            result.status < 600\n          ) {\n            try {\n              const { getGovernorActiveBreaker } = await import('../governor/activeCanary.ts');\n              getGovernorActiveBreaker().recordFailure();\n            } catch {}\n          }\n\n          // Success — validate response quality before returning'''
          if old not in text:
              raise SystemExit('combo dispatch result patch anchor not found')
          text = text.replace(old, new, 1)

          old = '''              emit("combo.target.failed", {\n                comboName: combo.name,\n                targetIndex: i,\n                provider,\n                model: modelStr,\n                error: `Quality: ${quality.reason}`,\n                latencyMs: Date.now() - startTime,\n              });\n              return null;'''
          new = '''              emit("combo.target.failed", {\n                comboName: combo.name,\n                targetIndex: i,\n                provider,\n                model: modelStr,\n                error: `Quality: ${quality.reason}`,\n                latencyMs: Date.now() - startTime,\n              });\n              if (target.governorSelected === true) {\n                try {\n                  const { getGovernorActiveBreaker } = await import('../governor/activeCanary.ts');\n                  getGovernorActiveBreaker().recordFailure();\n                } catch {}\n              }\n              return null;'''
          if old not in text:
              raise SystemExit('combo quality failure patch anchor not found')
          text = text.replace(old, new, 1)

          old = '''            emit("combo.target.succeeded", {\n              comboName: combo.name,\n              targetIndex: i,\n              provider,\n              model: modelStr,\n              latencyMs,\n            });'''
          new = '''            if (target.governorSelected === true) {\n              try {\n                const { getGovernorActiveBreaker } = await import('../governor/activeCanary.ts');\n                getGovernorActiveBreaker().recordSuccess();\n              } catch {}\n            }\n            emit("combo.target.succeeded", {\n              comboName: combo.name,\n              targetIndex: i,\n              provider,\n              model: modelStr,\n              latencyMs,\n            });'''
          if old not in text:
              raise SystemExit('combo success patch anchor not found')
          text = text.replace(old, new, 1)
          combo.write_text(text, encoding='utf-8')

          auto = Path('open-sse/services/combo/resolveAutoStrategy.ts')
          text = auto.read_text(encoding='utf-8')
          old = '''        correlationId,\n        nativeSelectedTarget: selectedTarget,'''
          new = '''        correlationId:\n          correlationId ??\n          (typeof relayOptions?.governorCorrelationId === "string"\n            ? relayOptions.governorCorrelationId\n            : null),\n        nativeSelectedTarget: selectedTarget,'''
          if old not in text:
              raise SystemExit('auto strategy correlation patch anchor not found')
          text = text.replace(old, new, 1)
          auto.write_text(text, encoding='utf-8')

          chat = Path('src/sse/handlers/chat.ts')
          text = chat.read_text(encoding='utf-8')
          old = '''  const mode = getGovernorMode();\n  const governed = !isCombo && (String(originalModel).startsWith("auto/") || originalModel === "auto");\n  if (!governed || runtimeOptions.governorBypass || mode === "off") {'''
          new = '''  const mode = getGovernorMode();\n  const governed = !isCombo && (String(originalModel).startsWith("auto/") || originalModel === "auto");\n  const hasExplicitConnection =\n    typeof runtimeOptions.forcedConnectionId === "string" && runtimeOptions.forcedConnectionId.trim().length > 0;\n  if (!governed || runtimeOptions.governorBypass || mode === "off" || hasExplicitConnection) {'''
          if old not in text:
              raise SystemExit('direct seam explicit-connection anchor not found')
          text = text.replace(old, new, 1)

          old = '''    const { result } = GovernorManager.evaluateRequest(input, {'''
          new = '''    const { result, context } = GovernorManager.evaluateRequest(input, {'''
          if old not in text:
              raise SystemExit('direct seam evaluation anchor not found')
          text = text.replace(old, new, 1)

          old = '''    const canApply = config.activeEnabled && !breaker.isTripped() && (mode === "active" || mode === "active-canary") && result.plan?.executable === true;'''
          new = '''    const canApply =\n      config.activeEnabled &&\n      !breaker.isTripped() &&\n      context.activeSelected &&\n      (mode === "active" || mode === "active-canary") &&\n      result.plan?.executable === true;'''
          if old not in text:
              raise SystemExit('direct seam active-selected anchor not found')
          text = text.replace(old, new, 1)
          chat.write_text(text, encoding='utf-8')

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Governor focused tests
        run: |
          node --import tsx/esm --import ./open-sse/utils/setupPolyfill.ts --import ./tests/_setup/isolateDataDir.ts --test --test-force-exit --test-concurrency=1 tests/unit/governor/*.test.ts

      - name: TypeScript check
        run: |
          npm run typecheck:core
          npm run check:open-sse-typecheck

      - name: Router evaluation
        run: npm run check:router-eval

      - name: Diff check
        run: git diff --check

      - name: Commit validated runtime patch and remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/governor-pr7-runtime-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add open-sse/services/combo.ts open-sse/services/combo/resolveAutoStrategy.ts src/sse/handlers/chat.ts .github/workflows/governor-pr7-runtime-closure.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(governor): close active runtime lifecycle"
          git push origin HEAD:fix/governor-v1-runtime-closure-20260810
