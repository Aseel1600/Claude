name: React Best Practices (Vercel)

# Gate de Vercel React Best Practices — subconjunto estaticamente detectável
# (scripts/check/check-vercel-react-best-practices.mjs). Ratchet: falha APENAS
# quando um PR adiciona violações NOVAS em relação ao baseline congelado em
# config/quality/quality-baseline.json (metrics.vercelReact.*). A dívida
# pré-existente fica congelada — reduzir é melhoria, aumentar é red.
#
# Zero dependências: Node puro, sem npm ci, sem API keys. Roda em forks sem
# segredos (próprio-origin, como os demais gates).

on:
  pull_request:
  push:
    branches:
      - main
      - "release/v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Vercel React best practices (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run Vercel React best-practices check
        run: node scripts/check/check-vercel-react-best-practices.mjs
