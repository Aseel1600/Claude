name: API typecheck validation probe

on:
  push:
    branches: ["ci/api-route-typecheck-gate"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - uses: ./.github/actions/npm-ci-retry
      - name: API route typecheck gate
        run: node scripts/check/check-api-typecheck.mjs
      - name: API typecheck gate unit tests
        run: node --import tsx/esm --test tests/unit/build/check-api-typecheck.test.ts
      - name: Lint
        run: npm run lint
