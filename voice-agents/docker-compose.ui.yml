services:
  omniroute-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: omniroute-ui
    ports:
      - "20129:20129"
    volumes:
      - ${OMNIROUTE_ROOT:-.}/data:/app/data
      - ${OMNIROUTE_ROOT:-.}/ui/static:/app/ui/static
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:20129/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
