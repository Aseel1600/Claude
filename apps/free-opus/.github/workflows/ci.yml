name: CI

on:
  push:
    branches: [ "tatianadug-feat-free-opus-mvp", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: cd apps/free-opus && npm ci
      - run: cd apps/free-opus && npm test
